
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>REC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
}

/* 確認画面：90度回転 */
#intro {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.messageBox {
    width: min(90%, 500px);
    text-align: center;
    line-height: 1.8;
}

.messageBox h2 {
    margin-bottom: 30px;
}

.messageBox button {
    margin-top: 30px;
    padding: 12px 24px;
    font-size: 16px;
    background: white;
    color: black;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* REC画面 */
#start {
    position: fixed;
    inset: 0;
    display: none;
    background: #000;
    opacity: 1;
}

.topbar {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    letter-spacing: .15em;
    opacity: .8;
}

.rec-indicator {
    color: red;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}

.viewfinder {
    position: absolute;
    inset: 60px 30px 120px;
    overflow: hidden;
}

#cameraPreview {
    display: none;
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    opacity: 1;
}

.corner {
    position: absolute;
    width: 35px;
    height: 35px;
    z-index: 2;
}

.tl {
    top: 0;
    left: 0;
    border-top: 2px solid white;
    border-left: 2px solid white;
}

.tr {
    top: 0;
    right: 0;
    border-top: 2px solid white;
    border-right: 2px solid white;
}

.bl {
    bottom: 0;
    left: 0;
    border-bottom: 2px solid white;
    border-left: 2px solid white;
}

.br {
    bottom: 0;
    right: 0;
    border-bottom: 2px solid white;
    border-right: 2px solid white;
}

.message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: .6;
    font-size: 15px;
    line-height: 1.8;
    letter-spacing: .1em;
    pointer-events: none;
}

#recButton {
    position: absolute;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    background: none;
    border: none;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
}

.dot {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: red;
    margin-bottom: 12px;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(.9);
        opacity: .7;
    }
}

.label {
    letter-spacing: .2em;
    font-size: 14px;
}

/* MP4動画：90度回転 */
#video {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vh;
    height: 100vw;
    object-fit: contain;
    background: black;
    transform: translate(-50%, -50%) rotate(90deg);
    opacity: 0;
    transition: opacity 1.2s ease;
}

/* 動画終了時のフェードアウト */
#video.fade-out {
    opacity: 0;
}
</style>
</head>

<body>

<!-- 確認画面 -->
<div id="intro">
    <div class="messageBox">
        <h2>確認画面</h2>
        <p>
            係の案内があるまで<br>
            この画面のままお待ちください
        </p>
        <button id="nextBtn">確認しました</button>
    </div>
</div>

<!-- REC画面 -->
<div id="start">
    <div class="topbar">
        <div><span class="rec-indicator">● REC</span></div>
        <div>CAM 01</div>
    </div>

    <div class="viewfinder">
        <video id="cameraPreview" autoplay playsinline muted></video>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
    </div>

    <div class="message">稽古映像を記録します</div>

    <button id="recButton">
        <div class="dot"></div>
        <div class="label">REC</div>
    </button>
</div>

<!-- 再生する動画 -->
<video id="video" playsinline preload="auto">
    <source src="movie.mp4" type="video/mp4">
</video>

<script>
const intro = document.getElementById("intro");
const start = document.getElementById("start");
const nextBtn = document.getElementById("nextBtn");
const recButton = document.getElementById("recButton");
const cameraPreview = document.getElementById("cameraPreview");
const video = document.getElementById("video");

let cameraStream = null;
let isTransitioning = false;

/* 外カメラを指定して起動 */
async function startCamera() {
    try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
            throw new Error("カメラを利用できません");
        }

        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { exact: "environment" }
                },
                audio: false
            });

        cameraPreview.srcObject = cameraStream;
        cameraPreview.style.display = "block";
        await cameraPreview.play();

    } catch (error) {
        console.error("外カメラ起動エラー:", error);

        alert(
            "外カメラを起動できませんでした。\n" +
            "ブラウザのカメラ許可や端末の設定を確認してください。"
        );
    }
}

/* 確認しました → REC画面 */
nextBtn.onclick = async () => {
    intro.style.display = "none";
    start.style.display = "block";
    start.style.opacity = "1";

    await startCamera();
};

/* RECボタン → ふわっと動画に切り替え */
recButton.onclick = async () => {
    if (isTransitioning) return;
    isTransitioning = true;
    recButton.disabled = true;

    // 動画を先に準備する
    video.classList.remove("fade-out");
    video.style.transition = "none";
    video.style.opacity = "0";
    video.style.display = "block";
    video.currentTime = 0;

    try {
        // 再生を開始してからフェードを始める
        await video.play();

        // REC画面を0.8秒で暗くする
        start.style.transition = "opacity 0.8s ease";
        start.style.opacity = "0";

        // 動画を1.2秒でフェードイン
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                video.style.transition = "opacity 1.2s ease";
                video.style.opacity = "1";
            });
        });

        // REC画面が暗くなったらカメラを終了
        setTimeout(() => {
            start.style.display = "none";

            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            cameraPreview.srcObject = null;
            cameraPreview.style.display = "none";
            cameraPreview.style.opacity = "1";
        }, 800);

    } catch (error) {
        console.error("動画再生エラー:", error);

        video.pause();
        video.style.display = "none";
        start.style.opacity = "1";

        alert(
            "動画を再生できません。\n" +
            "movie.mp4 の名前と配置を確認してください。"
        );

        isTransitioning = false;
        recButton.disabled = false;
    }
};

/* 動画終了 → 2秒でフェードアウト */
video.addEventListener("ended", () => {
    video.style.transition = "opacity 2s ease";
    video.style.opacity = "0";

    setTimeout(() => {
        video.style.display = "none";
        video.currentTime = 0;
        isTransitioning = false;
    }, 2000);
});

/* 動画読み込みエラー */
video.addEventListener("error", () => {
    console.error("movie.mp4 を読み込めませんでした");
});
</script>

</body>
</html>
